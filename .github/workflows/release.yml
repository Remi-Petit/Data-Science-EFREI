name: Release

on:
  push:
    tags: ["next-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex: next-0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  models:
    name: Entraînement + export ONNX
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Cache des modèles ONNX
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            IA/Sujet_*/models/*.onnx
            IA/Sujet_*/models/*.classes.json
          key: models-${{ hashFiles('IA/**/*.py', 'IA/**/*.csv', 'IA/requirements.txt', 'IA/**/models_config.json') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: IA/requirements.txt

      - name: Entraînement et export
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r IA/requirements.txt
          python IA/train_models.py
          python IA/export_onnx.py
          rm -f IA/Sujet_*/models/*.joblib

      - name: Archive des modèles
        run: tar czf models-onnx.tar.gz IA/Sujet_*/models/*.onnx IA/Sujet_*/models/*.classes.json

      - uses: actions/upload-artifact@v4
        with:
          name: models-onnx
          path: models-onnx.tar.gz
          retention-days: 7

  release:
    name: Build + publication
    runs-on: ubuntu-latest
    needs: models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: models-onnx

      - name: Extraction des modèles
        run: tar xzf models-onnx.tar.gz

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend

      - name: Binaire backend
        run: |
          cargo build --release --manifest-path Backend/Cargo.toml
          tar czf backend-linux-x86_64.tar.gz -C Backend/target/release backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci
          npm run build
          tar czf ../frontend-build.tar.gz -C build .

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom des images
        id: img
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image backend (modèles inclus)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-backend:${{ env.TAG }}
            ${{ steps.img.outputs.base }}-backend:next-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-frontend:${{ env.TAG }}
            ${{ steps.img.outputs.base }}-frontend:next-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Création de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.img.outputs.base }}
        run: |
          sha256sum backend-linux-x86_64.tar.gz frontend-build.tar.gz models-onnx.tar.gz > SHA256SUMS
          cat > notes.md <<EOF
          Version du backend Rust (Axum + ONNX Runtime) et du frontend Svelte.

          Images Docker :
          - \`${BASE}-backend:${TAG}\` (modèles ONNX inclus)
          - \`${BASE}-frontend:${TAG}\`

          Assets : binaire backend Linux x86_64, build statique du frontend, modèles ONNX, SHA256SUMS.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" backend-linux-x86_64.tar.gz frontend-build.tar.gz models-onnx.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --latest \
              --notes-file notes.md \
              backend-linux-x86_64.tar.gz frontend-build.tar.gz models-onnx.tar.gz SHA256SUMS
          fi
