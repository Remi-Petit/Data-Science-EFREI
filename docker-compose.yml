services:
  fastapi:
    container_name: fastapi_efrei_data_science
    build:
      context: .
      dockerfile: FastAPI/Dockerfile
      pull: true
    ports:
      - "${FASTAPI_PORT:-40001}:8000"
    environment:
      - MODELS_DIR=/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  streamlit:
    container_name: streamlit_efrei_data_science
    build:
      context: .
      dockerfile: Streamlit/Dockerfile
      pull: true
    ports:
      - "${STREAMLIT_PORT:-40000}:8501"
    environment:
      - API_URL=http://fastapi:8000
    depends_on:
      fastapi:
        condition: service_healthy