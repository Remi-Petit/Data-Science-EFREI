services:
  app:
    container_name: data_science_efrei_app
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    ports:
      - "${APP_PORT:-40000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
