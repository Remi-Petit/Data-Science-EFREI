when:
  - event: push
    branch: master
  - event: pull_request
    branch: master

steps:
  # ── Lint ──────────────────────────────────────────────
  - name: lint
    image: python:3.11-slim
    commands:
      - pip install flake8
      - flake8 FastAPI/ Streamlit/ IA/ --select=E9,F63,F7,F82 --show-source

  # ── Train ─────────────────────────────────────────────
  - name: train
    image: python:3.11-slim
    commands:
      - pip install -r IA/requirements.txt
      - python IA/train_all.py
    depends_on:
      - lint

  # ── Build ─────────────────────────────────────────────
  - name: build-fastapi
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -f FastAPI/Dockerfile -t fastapi-app .
    depends_on:
      - train

  - name: build-streamlit
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -f Streamlit/Dockerfile -t streamlit-app .
    depends_on:
      - train

  # ── Integration test ──────────────────────────────────
  - name: integration
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose up -d --build
      - |
        for i in $(seq 1 30); do
          if docker exec fastapi_efrei_data_science python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
            echo "FastAPI is healthy"
            break
          fi
          if [ "$i" = "30" ]; then
            echo "FastAPI failed to start"
            docker compose logs
            exit 1
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
      - |
        for i in $(seq 1 15); do
          if docker exec streamlit_efrei_data_science python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')" 2>/dev/null; then
            echo "Streamlit is healthy"
            break
          fi
          if [ "$i" = "15" ]; then
            echo "Streamlit failed to start"
            docker compose logs
            exit 1
          fi
          echo "Waiting... ($i/15)"
          sleep 2
        done
      - docker compose down
    depends_on:
      - build-fastapi
      - build-streamlit

  # ── Deploy (master push uniquement) ───────────────────
  - name: deploy
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml down || true
      - docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
      - |
        for i in $(seq 1 30); do
          if docker exec fastapi_efrei_data_science python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
            echo "Deployed successfully - FastAPI is healthy"
            break
          fi
          if [ "$i" = "30" ]; then
            echo "Deployment failed"
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml logs
            exit 1
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
    when:
      - event: push
        branch: master
    depends_on:
      - integration
