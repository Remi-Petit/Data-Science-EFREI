when:
  - event: push
    branch: master
  - event: pull_request
    branch: master

steps:
  # ── Lint ──────────────────────────────────────────────
  - name: lint
    image: python:3.11-slim
    commands:
      - pip install flake8
      - flake8 IA/ --select=E9,F63,F7,F82 --show-source

  # ── Train ─────────────────────────────────────────────
  - name: train
    image: python:3.11-slim
    volumes:
      - pip-cache:/root/.cache/pip
      - train-cache:/cache
    commands:
      - |
        HASH=$(find IA/ -type f \
          -not -path '*/models/*' \
          -not -path '*/results/*' \
          -not -path '*/models_stats/*' \
          -not -path '*/notebook/*' \
          -not -path '*__pycache__*' \
          | sort | xargs md5sum | md5sum | cut -d' ' -f1)
        echo "Source hash: $HASH"
        if [ -f /cache/hash ] && [ "$(cat /cache/hash)" = "$HASH" ] && [ -d /cache/models ]; then
          echo "IA/ inchangé → restauration depuis le cache"
          cp -r /cache/models/Sujet_1 IA/Sujet_1/models
          cp -r /cache/models/Sujet_2 IA/Sujet_2/models
          cp -r /cache/models/Sujet_3 IA/Sujet_3/models
        else
          echo "IA/ modifié ou pas de cache → entraînement"
          pip install -r IA/requirements.txt
          python IA/train_all.py
          python IA/export_onnx.py
          rm -rf /cache/models
          mkdir -p /cache/models
          cp -r IA/Sujet_1/models /cache/models/Sujet_1
          cp -r IA/Sujet_2/models /cache/models/Sujet_2
          cp -r IA/Sujet_3/models /cache/models/Sujet_3
          echo "$HASH" > /cache/hash
        fi
    depends_on:
      - lint

  # ── Build ─────────────────────────────────────────────
  - name: build-app
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t data-science-efrei-app .
    depends_on:
      - train

  # ── Integration test ──────────────────────────────────
  - name: integration
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose up -d --build
      - |
        for i in $(seq 1 30); do
          if docker exec data_science_efrei_app curl -sf http://localhost:8000/api/health >/dev/null 2>&1 \
             && docker exec data_science_efrei_app curl -sf http://localhost:8000/ >/dev/null 2>&1; then
            echo "App is healthy (API + frontend)"
            break
          fi
          if [ "$i" = "30" ]; then
            echo "App failed to start"
            docker compose logs
            exit 1
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
      - docker compose down
    depends_on:
      - build-app

  # ── Deploy (master push uniquement) ───────────────────
  - name: deploy
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml down || true
      - docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
      - |
        for i in $(seq 1 30); do
          if docker exec data_science_efrei_app curl -sf http://localhost:8000/api/health 2>/dev/null; then
            echo "Deployed successfully - app is healthy"
            break
          fi
          if [ "$i" = "30" ]; then
            echo "Deployment failed"
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml logs
            exit 1
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
    when:
      - event: push
        branch: master
    depends_on:
      - integration
